	<h2>
		立体選択性
	</h2>
	有機分子の中には、自分自身とその鏡像が重なり合わない構造を持つものがあります。そのような性質を「キラリティ」と言って、キラリティを持っている状態を「キラルである」と言います。
	さて、キラルではない分子（=アキラルな分子）に一手変換を施すと、キラルになることがあります。例えば、ベンズアルデヒドにシアン化水素付加を行うと、キラルな第二級アルコールが生じます。
